name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Format using gofmt
        run: |
          gofmt -w .

      - name: Run tests
        run: go test ./...

      - name: Build
        run: go build ./...
